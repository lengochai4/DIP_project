project:
  name: "DIP Touchless STEM"
  config_schema_version: "1"

camera:
  width: 640
  height: 480
  requested_fps: 30
  backend: "default"

runtime:
  mode: "realtime"
  replay_source: null

roi:
  padding_ratio: 0.20
  coast_expand_ratio: 0.15
  coast_frames: 5
  min_width: 1
  min_height: 1

illumination:
  ema_alpha: 0.20

  low_light_enter_v: 70.0
  low_light_exit_v: 85.0

  low_contrast_enter_range_v: 35.0
  low_contrast_exit_range_v: 45.0

clahe:
  policy: "adaptive"
  clip_limit: 2.0
  tile_grid_size: [8, 8]

tracking:
  provider: "mediapipe"
  model_path: null
  num_hands: 1
  min_hand_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5

filter:
  mode: "RAW"

  # F1 canonical fixed 1-Euro
  min_cutoff_hz: 1.0
  beta: 0.0

  # Shared F1/F2 temporal parameters
  derivative_cutoff_hz: 1.0
  reset_gap_s: 0.50

  # F2 project-specific bounded adaptive 1-Euro.
  # Engineering starter values only; not claimed optima.
  adaptive:
    base_cutoff_hz: 1.0

    beta_min: 0.0
    beta_base: 0.0
    beta_max: 1.0

    velocity_gain: 0.1
    velocity_max: 10.0

    final_cutoff_min_hz: 1.0
    final_cutoff_max_hz: 10.0

    quality_adaptation_enabled: false

gesture:
  pinch_on: 0.30
  pinch_off: 0.40

logging:
  schema_version: "1"
  output_dir: "runs"
  record_raw_video: false

experiment:
  experiment_id: null
  condition: null
  trial_id: null

renderer:
  enabled: true
  width: 1280
  height: 720