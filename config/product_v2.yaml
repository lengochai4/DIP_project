fingertip_depth_gain: 1.0
fingertip_depth_limit: 2.0
# Product-only relative SVD threshold; engineering default, not physical accuracy.
geometry_planarity_ratio: 0.03
# Educational reference: NIST CCCBDB NH3 experimental H-N-H angle; scene lengths unscaled.
molecule_nh3_angle_deg: 106.7
