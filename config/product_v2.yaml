# V2 engineering defaults; neither research results nor physically validated optima.
max_gap_s: 0.5
pose_dwell_s: 0.18
# Product finger bends use aspect-correct model-relative xyz, never metric depth.
finger_straightness: 0.82
finger_angle_rad: 2.35
thumb_spread: 0.45
palm_epsilon: 0.000001
release_duration_s: 1.2
release_min_samples: 12
release_max_mad: 0.08
reference_shape_delta: 0.30
pinch_enter: 0.60
pinch_exit: 0.25
pinch_progress: 0.18
pinch_dwell_s: 0.20
rearm_s: 0.25
closing_timeout_s: 3.0
association_distance: 0.4
association_margin: 0.04
measure_dwell_s: 0.5
measure_motion: 0.025
anchor_tau_s: 0.10
anchor_gain: 1.6
min_scale: 0.2
max_scale: 5.0
motion_gain: 3.0
max_delta: 0.12
pointer_gain: 1.0
# Window control gain only; HAND scene cursor stays aligned with camera tip.
dwell_select_s: 1.2
filter_min_cutoff_hz: 1.0
filter_beta: 0.05
filter_derivative_cutoff_hz: 1.0
camera_distance: 8.0
provider_max_hands: 3
world_fit_fraction: 0.70
construction_tolerance: 0.000001
construction_grid_step: 0.25
