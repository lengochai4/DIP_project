# EXPERIMENTAL observation-only PINCH calibration candidate, not a default.
# Based on P1e contact geometry; near-touch false positives remain unvalidated.
# Select explicitly with full_hand_app --mode OBSERVE_FULL_HAND --profile <this file>.
# Only pinch ENTER differs from full_hand_observe.yaml; no commands are enabled.
pose:
  fingers:
    extended_min_angle_rad: 2.6
    flexed_max_angle_rad: 1.5
    extended_min_straightness: 0.9
    flexed_max_straightness: 0.65
  thumb:
    chain:
      extended_min_angle_rad: 2.6
      flexed_max_angle_rad: 1.5
      extended_min_straightness: 0.9
      flexed_max_straightness: 0.65
    opposition_max_distance_palm: 0.5
    spread_min_distance_palm: 0.65
    extended_max_axis_to_palm_rad: 2.0
  pinch_enter_distance_palm: 0.33
  pinch_exit_distance_palm: 0.35
temporal:
  enter_dwell_s: 0.125
  exit_dwell_s: 0.25
  pinch_enter_dwell_s: 0.25
  pinch_exit_dwell_s: 0.375
  rearm_dwell_s: 0.125
  reset_gap_s: 2.0
