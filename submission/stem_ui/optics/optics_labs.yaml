schema: 1
category: optics
title: "Mô phỏng Thí nghiệm Quang học STEM"
labs:
  refraction:
    id: refraction
    title: "Định luật Khúc xạ & Phản xạ toàn phần"
    subtitle: "Khúc xạ ánh sáng qua mặt phân cách hai môi trường trong suốt"
    formula: "n₁ sin(i) = n₂ sin(r); sin(i_gh) = n₂ / n₁ (với n₁ > n₂)"
    description: "Khảo sát sự đổi hướng của tia sáng khi đi qua ranh giới giữa 2 môi trường chiết suất khác nhau, và quan sát hiện tượng phản xạ toàn phần khi góc tới vượt quá góc giới hạn."
    challenge: "Tìm góc tới hạn i_gh khi truyền từ Thủy tinh (n₁=1.52) sang Không khí (n₂=1.00) và điều chỉnh để 100% ánh sáng phản xạ toàn phần."
    params:
      n1:
        label: "Chiết suất môi trường 1 (n₁)"
        unit: ""
        min: 1.0
        max: 2.5
        step: 0.05
        default: 1.517
      n2:
        label: "Chiết suất môi trường 2 (n₂)"
        unit: ""
        min: 1.0
        max: 2.5
        step: 0.05
        default: 1.000
      incident_angle:
        label: "Góc tới (i)"
        unit: "°"
        min: 0.0
        max: 85.0
        step: 1.0
        default: 45.0

  lens:
    id: lens
    title: "Thấu kính mỏng Hội tụ & Phân kì"
    subtitle: "Sự tạo ảnh bởi thấu kính mỏng và 3 tia sáng đặc biệt"
    formula: "1/f = 1/d + 1/d'; k = -d'/d; h' = k·h"
    description: "Mô phỏng đường truyền của 3 tia sáng đặc biệt qua quang tâm O và các tiêu điểm F, F', xác định vị trí và tính chất của ảnh thật / ảnh ảo."
    challenge: "Điều chỉnh vị trí vật d để tạo ảnh thật ngược chiều gấp 2 lần vật (k = -2.0) với thấu kính hội tụ f = +15 cm."
    params:
      focal_length:
        label: "Tiêu cự thấu kính (f)"
        unit: "cm"
        min: -30.0
        max: 30.0
        step: 1.0
        default: 15.0
      object_distance:
        label: "Khoảng cách vật (d)"
        unit: "cm"
        min: 5.0
        max: 55.0
        step: 1.0
        default: 25.0
      object_height:
        label: "Chiều cao vật (h)"
        unit: "cm"
        min: 1.0
        max: 8.0
        step: 0.5
        default: 4.0

  prism:
    id: prism
    title: "Tán sắc ánh sáng qua Lăng kính"
    subtitle: "Hiện tượng tán sắc ánh sáng trắng thành dải quang phổ 7 màu"
    formula: "sin(i₁) = n·sin(r₁); r₁ + r₂ = A; sin(i₂) = n·sin(r₂); D = i₁ + i₂ - A"
    description: "Chiếu chùm ánh sáng trắng qua lăng kính tam giác; do chiết suất n(λ) phụ thuộc vào bước sóng nên các màu đơn sắc bị lệch các góc khác nhau (Đỏ lệch ít nhất, Tím lệch nhiều nhất)."
    challenge: "Chọn góc tới i₁ để góc lệch D đạt giá trị cực tiểu (D_min) và dải màu tách ra rõ nhất trên màn hứng."
    params:
      apex_angle:
        label: "Góc chiết quang (A)"
        unit: "°"
        min: 30.0
        max: 70.0
        step: 1.0
        default: 60.0
      incident_angle:
        label: "Góc tới mặt 1 (i₁)"
        unit: "°"
        min: 20.0
        max: 75.0
        step: 1.0
        default: 48.0
      material:
        label: "Vật liệu lăng kính"
        unit: ""
        options: ["crown_glass", "flint_glass", "water", "diamond"]
        default: "flint_glass"
