# Conservative neutral covalent editing rules; not general chemistry valences.
chemistry_covalent_limits: {H: 1, C: 4, N: 3, O: 2, F: 1, P: 3, S: 2, Cl: 1, Br: 1, I: 1}
chemistry_common_elements: [H, C, N, O, F, P, S, Cl]
chemistry_templates:
  H2O:
    label: 'H₂O • Nước'
    symbols: [O, H, H]
    positions: [[0, 0, 0], [-0.45, -0.35, 0], [0.45, -0.35, 0]]
    bonds: [[0, 1, 1], [0, 2, 1]]
  CO2:
    label: 'CO₂ • Carbon dioxide'
    symbols: [C, O, O]
    positions: [[0, 0, 0], [-0.65, 0, 0], [0.65, 0, 0]]
    bonds: [[0, 1, 2], [0, 2, 2]]
  CH4:
    label: 'CH₄ • Methane'
    symbols: [C, H, H, H, H]
    positions: [[0, 0, 0], [0.32, 0.32, 0.32], [-0.32, -0.32, 0.32], [-0.32, 0.32, -0.32], [0.32, -0.32, -0.32]]
    bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1]]
  NH3:
    label: 'NH₃ • Ammonia'
    symbols: [N, H, H, H]
    positions: [[0, 0.12, 0], [0.5, -0.22, 0], [-0.25, -0.22, 0.43], [-0.25, -0.22, -0.43]]
    bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1]]
  H2:
    label: 'H₂ • Hydrogen'
    symbols: [H, H]
    positions: [[-0.28, 0, 0], [0.28, 0, 0]]
    bonds: [[0, 1, 1]]
  O2:
    label: 'O₂ • Oxygen'
    symbols: [O, O]
    positions: [[-0.28, 0, 0], [0.28, 0, 0]]
    bonds: [[0, 1, 2]]
  N2:
    label: 'N₂ • Nitrogen'
    symbols: [N, N]
    positions: [[-0.28, 0, 0], [0.28, 0, 0]]
    bonds: [[0, 1, 3]]
  HCl:
    label: 'HCl • Hydrogen chloride'
    symbols: [H, Cl]
    positions: [[-0.28, 0, 0], [0.28, 0, 0]]
    bonds: [[0, 1, 1]]
