[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dip-touchless-stem"
version = "0.1.0"
description = "Digital Image Processing pipeline for real-time touchless 3D STEM interaction."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=2.0",
    "mediapipe==1.0.1",
    "opencv-contrib-python==4.14.0.94",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]